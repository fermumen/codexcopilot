[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghc-launch-codex"
version = "0.1.0"
description = "Launch Codex App against GitHub Copilot through a local OpenAI-compatible proxy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Local" }]
dependencies = []

[project.scripts]
githubcopilot = "ghc_launch_codex.cli:main"
ghc-launch-codex = "ghc_launch_codex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ghc_launch_codex"]

